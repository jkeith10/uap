[tool.poetry]
name = "uap"
version = "1.0.0"
description = "Unified Autonomy Protocol - A cross-domain, self-optimizing protocol for intelligent system orchestration"
authors = ["UAP Team"]
readme = "README.md"
packages = [{include = "uap", from = "src"}]

[tool.poetry.scripts]
uap = "uap.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
opentelemetry-instrumentation-redis = "^0.42b0"
opentelemetry-instrumentation-asyncpg = "^0.42b0"
opentelemetry-exporter-jaeger = "^1.21.0"
opentelemetry-exporter-prometheus = "^1.21.0"
websockets = "^12.0"
httpx = "^0.25.2"
aiofiles = "^23.2.1"
pyyaml = "^6.0.1"
jsonschema = "^4.20.0"
jsonld = "^1.0.0"
numpy = "^1.25.2"
scikit-learn = "^1.3.2"
pgvector = "^0.2.4"
structlog = "^23.2.0"
tenacity = "^8.2.3"
croniter = "^1.4.1"
alembic = "^1.13.0"
click = "^8.1.7"
typer = "^0.9.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
hypothesis = "^6.92.0"
locust = "^2.19.0"
bandit = "^1.7.5"
codecov = "^2.1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
